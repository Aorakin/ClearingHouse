          description: "Success"

  /tickets/namespace/{namespace_id}:
    get:
      tags:
        - "Tickets"
      summary: "Get tickets by namespace"
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: namespace_id
          required: true
          type: string
      responses:
        200:
          description: "Success"

  /tickets/user:
    get:
      tags:
        - "Tickets"
      summary: "Get user tickets"
      security:
        - BearerAuth: []
      responses:
        200:
          description: "Success"

  /tickets/start:
    patch:
      tags:
        - "Tickets"
      summary: "Start ticket"
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
      responses:
        200:
          description: "Success"

  /tickets/stop-pending:
    patch:
      tags:
        - "Tickets"
      summary: "Stop pending ticket"
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
      responses:
        200:
          description: "Success"

  /tickets/stop:
    patch:
      tags:
        - "Tickets"
      summary: "Stop ticket"
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
      responses:
        200:
