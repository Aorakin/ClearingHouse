      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          type: string
      responses:
        200:
          description: "Success"

  /projects/members:
    post:
      tags:
        - "Projects"
      summary: "Add members to project"
      security:
        - BearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
      responses:
        200:
          description: "Success"

  /projects/rm-members:
    post:
      tags:
