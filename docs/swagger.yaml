swagger: "2.0"
info:
  title: "ClearingHouse API"
  description: "API for managing organizations, projects, namespaces, resources, and quotas"
  version: "1.0"
  contact: {}
basePath: ""
schemes:
  - http
  - https
securityDefinitions:
  BearerAuth:
    type: apiKey
    name: Authorization
    in: header
    description: "JWT token (format: 'Bearer {token}')"
  ApiKeyAuth:
    type: apiKey
    name: Authorization
    in: header
    description: "JWT token (format: 'Bearer {token}')"

paths:
  # Home
  /:
    get:
      tags:
        - "Home"
      summary: "Welcome endpoint"
      description: "Check API health status"
      responses:
        200:
          description: "Success"

  # ========== Authentication ==========
  /auth/login/google:
    get:
      tags:
        - "Authentication"
      summary: "Start Google OAuth login"
      responses:
        302:
          description: "Redirect to Google OAuth"

  /auth/callback/google:
    get:
      tags:
        - "Authentication"
      summary: "Google OAuth callback for login"
      responses:
        200:
          description: "Success"

  /auth/register/google:
    get:
      tags:
        - "Authentication"
      summary: "Start Google OAuth registration"
      responses:
        302:
          description: "Redirect to Google OAuth"

  /auth/register/manual:
    post:
      tags:
        - "Authentication"
      summary: "Register with email and password"
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            properties:
              email:
                type: string
              password:
                type: string
              first_name:
                type: string
              last_name:
                type: string
      responses:
        201:
          description: "Created"

  /auth/logout:
    get:
      tags:
        - "Authentication"
      summary: "Logout"
      responses:
        200:
          description: "Success"

  /auth/refresh-token:
    get:
      tags:
        - "Authentication"
      summary: "Refresh JWT token"
      responses:
        200:
          description: "Success"

  /auth/me:
    get:
      tags:
        - "Authentication"
      summary: "Get authenticated user profile"
      security:
        - BearerAuth: []
      responses:
        200:
          description: "Success"

  # ========== Organizations ==========
  /organizations/:
    get:
      tags:
        - "Organizations"
      summary: "Get all organizations"
      responses:
        200:
          description: "Success"
    post:
      tags:
        - "Organizations"
      summary: "Create organization (super admin only)"
      security:
        - BearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            properties:
              name:
                type: string
              abbreviation:
                type: string
      responses:
        201:
          description: "Created"

  /organizations/{org-id}:
    get:
      tags:
        - "Organizations"
      summary: "Get organization by ID"
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: org-id
          required: true
          type: string
      responses:
        200:
          description: "Success"
    put:
      tags:
        - "Organizations"
      summary: "Update organization (super admin only)"
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: org-id
          required: true
          type: string
        - in: body
          name: body
          required: true
          schema:
            type: object
      responses:
        200:
          description: "Success"
    delete:
      tags:
        - "Organizations"
      summary: "Delete organization (super admin only)"
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: org-id
          required: true
          type: string
      responses:
        200:
          description: "Success"

  /organizations/members:
    post:
      tags:
        - "Organizations"
      summary: "Add members to organization"
      security:
        - BearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            properties:
              organization_id:
                type: string
              user_ids:
                type: array
                items:
                  type: string
      responses:
        200:
          description: "Success"
    get:
      tags:
        - "Organizations"
      summary: "Get user memberships"
      security:
        - BearerAuth: []
      responses:
        200:
          description: "Success"

  /organizations/rm-members:
    post:
      tags:
        - "Organizations"
      summary: "Remove members from organization"
      security:
        - BearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
      responses:
        200:
          description: "Success"

  /organizations/admins:
    post:
      tags:
        - "Organizations"
      summary: "Add admins to organization"
      security:
        - BearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
      responses:
        200:
          description: "Success"

  /organizations/rm-admins:
    post:
      tags:
        - "Organizations"
      summary: "Remove admins from organization"
      security:
        - BearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
      responses:
        200:
          description: "Success"

  /organizations/{org-id}/members:
    get:
      tags:
        - "Organizations"
      summary: "Get organization members"
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: org-id
          required: true
          type: string
      responses:
        200:
          description: "Success"

  # ========== Projects ==========
