  # ========== Users ==========
  /users/access-token:
    get:
      description: "Exchange OAuth code via clearing house and set access/refresh token cookies"
      produces:
        - "application/json"
      tags:
        - "users"
      summary: "Exchange Google callback code for tokens"
      parameters:
        - type: string
          description: "Authorization code"
          name: code
          in: query
          required: true
        - type: string
          description: "OAuth state"
          name: state
          in: query
      responses:
        200:
          description: "Tokens set successfully"
          schema:
            type: object
            additionalProperties:
              type: string
        500:
          description: "Internal server error"
          schema:
            $ref: "#/definitions/response.ErrorResponse"

  /users/auth/google:
    get:
      description: "Redirect user to Google OAuth authorization page"
      produces:
        - "application/json"
      tags:
        - "users"
      summary: "Start Google OAuth login"
      responses:
        307:
          description: "Temporary redirect"
          schema:
            type: string

  /users/auth/callback/google:
    get:
      description: "Handle Google OAuth callback with authorization code"
      produces:
        - "application/json"
      tags:
        - "users"
      summary: "Google OAuth callback"
      parameters:
        - type: string
          description: "Authorization code"
          name: code
          in: query
          required: true
      responses:
        200:
          description: "Authentication response"
          schema:
            type: object
            additionalProperties: true
        302:
          description: "Redirect after successful login"
          schema:
            type: string
        400:
          description: "Bad request"
          schema:
            $ref: "#/definitions/response.ErrorResponse"
        500:
          description: "Internal server error"
          schema:
            $ref: "#/definitions/response.ErrorResponse"

  /users/auth/logout:
    get:
