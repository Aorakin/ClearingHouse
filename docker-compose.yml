
services:
  postgres:
    image: postgres:12.8
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
  web:
    build:
      context: .
      dockerfile: dockerfile-dev
    ports:
      - 8080:8080
    depends_on:
      - postgres
    volumes:
      - ./:/app
    restart: unless-stopped

volumes:
  postgres_data:
